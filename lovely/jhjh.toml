[manifest]
version = "1.0.0"
priority = 0

# set the played status of a card to false at round start.
[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = "G.GAME.current_round.used_packs = {}"
position = "after"
payload = '''

for _, v in ipairs(G.playing_cards) do
    v.ability.played_this_round = false
end
'''
match_indent = true

# Flag if a card has been played
[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = "v.ability.played_this_ante = true"
position = "after"
payload = "v.ability.played_this_round = true"
match_indent = true
